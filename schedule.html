<!doctype html>
<html lang="ru"
    ><head
        ><meta charset="UTF-8" /><meta
            name="viewport"
            content="width=device-width,initial-scale=1" /><meta
            name="theme-color"
            content="#edf3f8" /><title>Расписание — Newsearch</title
        ><meta
            name="description"
            content="Расписание ИВТ-5 · Дизайнеры-1 на осенний семестр 2026 года." /><link
            rel="icon"
            href="assets/icons/favicon.svg"
            type="image/svg+xml" /><script>
            if (
                location.protocol === 'file:' ||
                (['localhost', '127.0.0.1'].includes(location.hostname) &&
                    location.port === '63342')
            ) {
                const p = location.pathname.split('/').pop();
                location.replace(
                    'http://localhost/web6/' +
                        (['index.html', 'search.html', 'schedule.html'].includes(p)
                            ? p
                            : 'index.html')
                );
            }</script
        ><link rel="stylesheet" href="css/style.css?v=5" /><link
            rel="stylesheet"
            href="css/components.css?v=3" /><link
            rel="stylesheet"
            href="css/responsive.css?v=4" /></head
    ><body
        ><a class="skip-link" href="#main">К содержимому</a
        ><svg class="filter-defs" aria-hidden="true" width="0" height="0">
            <defs>
                <filter id="glass-refraction" x="0" y="0" width="100%" height="100%">
                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.009 0.015"
                        numOctaves="1"
                        seed="9"
                        result="noise"
                    />
                    <feGaussianBlur in="noise" stdDeviation="3" result="smooth" />
                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="smooth"
                        scale="8"
                        xChannelSelector="R"
                        yChannelSelector="G"
                    />
                </filter>
            </defs>
        </svg>
        <header class="site-header"
            ><div class="header-inner"
                ><a class="logo" href="index.html" aria-label="Newsearch — главная">Newsearch</a
                ><nav class="navigation liquid" aria-label="Основная навигация"
                    ><a href="index.html"
                        ><svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect x="4" y="4" width="16" height="16" rx="3" />
                            <path d="M8 8h8M8 12h8M8 16h4" /></svg
                        ><span>Новости</span></a
                    ><a href="search.html"
                        ><svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="9" cy="8" r="3" />
                            <path
                                d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 20v-2a6 6 0 0 0-4-5"
                            /></svg
                        ><span>Люди</span></a
                    ><a href="schedule.html"
                        ><svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect x="3" y="5" width="18" height="16" rx="4" />
                            <path d="M7 3v4m10-4v4M3 11h18M8 15h2m4 0h2m-8 3h2" /></svg
                        ><span>Расписание</span></a
                    ></nav
                ></div
            ></header
        >
        <main id="main" class="page-shell schedule-page"
            ><div class="page-heading schedule-heading"
                ><h1>Расписание</h1
                ><span class="group-label">ИВТ-5 · Дизайнеры-1 <span>3 курс</span></span></div
            >
            <section class="schedule-controls liquid" aria-label="Период и фильтры"
                ><div class="week-toolbar"
                    ><div class="week-heading"
                        ><h2 id="date-label"></h2><span class="muted" id="week-number"></span></div
                    ><div class="date-controls"
                        ><label class="sr-only" for="schedule-date">Дата недели</label
                        ><input
                            id="schedule-date"
                            type="date"
                            required
                            min="2026-09-01"
                            max="2026-12-31"
                        /><button id="today" type="button" class="button quiet"
                            >Текущая</button
                        ></div
                    ></div
                >
                <div class="schedule-filter-row"
                    ><div class="week-switch" role="group" aria-label="Учебная неделя"
                        ><button type="button" data-week="upper" aria-pressed="false"
                            >Верхняя</button
                        ><button type="button" data-week="lower" aria-pressed="false"
                            >Нижняя</button
                        ></div
                    ><form id="schedule-filters"
                        ><label class="sr-only" for="subject">Предмет</label
                        ><input
                            name="subject"
                            id="subject"
                            type="search"
                            maxlength="200"
                            placeholder="Найти предмет"
                        /><label class="sr-only" for="day">День недели</label
                        ><select name="day" id="day"
                            ><option value="">Вся неделя</option
                            ><option value="1">Понедельник</option
                            ><option value="2">Вторник</option
                            ><option value="3">Среда</option
                            ><option value="4">Четверг</option
                            ><option value="5">Пятница</option></select
                        ><button type="button" id="reset-filters" class="button quiet"
                            >Сбросить</button
                        ></form
                    ></div
                ><p id="filter-note" class="restore-note" role="status" hidden></p
            ></section>
            <section class="schedule-results" aria-label="Занятия"
                ><div class="list-toolbar"
                    ><span id="lesson-count" class="result-count" role="status"></span></div
                ><div id="lessons"></div></section></main
        ><footer class="site-footer"
            ><span>Newsearch</span><span>© <span data-year>2026</span></span></footer
        ><script type="module" src="js/common.js?v=2"></script
        ><script type="module" src="js/schedule.js?v=2"></script></body
></html>
