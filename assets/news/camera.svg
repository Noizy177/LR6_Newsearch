        <linearGradient id="bg" x2="1" y2="1">
            <stop stop-color="#e2edf6" />
            <stop offset="1" stop-color="#cddff2" />
        </linearGradient>
        <linearGradient id="screen" x2="1" y2="1">
            <stop stop-color="#6d9ae6" />
            <stop offset="1" stop-color="#1c438d" />
